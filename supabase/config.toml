# BEYOND — settings the Supabase CLI reads when deploying the Edge Functions:
#   npx supabase functions deploy beyond-apply beyond-admin beyond-join beyond-password-reset --project-ref <your-project-ref>
# Only Beyond's functions are listed here; nothing else in the shared project is affected.

# Only a local name the CLI needs; the real project is chosen with --project-ref
project_id = "beyond"

# verify_jwt = false: Supabase's gateway check is skipped and each function
# does its own. beyond-apply, beyond-join and beyond-password-reset are called by
# visitors who are not logged in (they check the website address, the spam check,
# rate limits and tokens). beyond-admin checks the session itself (auth.getUser)
# and that the person is an admin: this also works with Supabase's new JWT
# signing keys, which the gateway check doesn't support.

[functions.beyond-admin]
verify_jwt = false

[functions.beyond-apply]
verify_jwt = false

[functions.beyond-join]
verify_jwt = false

[functions.beyond-password-reset]
verify_jwt = false
