# Keeps the free Supabase project awake.
# Free projects pause after about a week without activity; this calls the tiny
# beyond_ping() database function every 3 days so the members area always works.
#
# Setup (once): GitHub repository → Settings → Secrets and variables → Actions →
#   New repository secret:  SUPABASE_URL       (e.g. https://abcdefgh.supabase.co)
#   New repository secret:  SUPABASE_ANON_KEY  (the "anon public" key)
# Test it: Actions tab → "Keep Supabase awake" → Run workflow.
#
# Note: GitHub turns off scheduled jobs in a repository with no commits for
# 60 days. It emails you first; one click on "Enable workflow" turns it back on.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 7 */3 * *"   # 07:17 UTC, every 3 days
  workflow_dispatch:          # "Run workflow" button, for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "The SUPABASE_URL and SUPABASE_ANON_KEY secrets are not set yet: nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/beyond_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase answered: it is awake."
