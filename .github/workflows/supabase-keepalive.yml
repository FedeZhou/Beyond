# Keeps the free Supabase project awake.
# Free projects pause after about a week without activity; this calls the tiny
# beyond_ping() database function every 3 days so the members area always works.
#
# Setup (once): GitHub repository → Settings → Secrets and variables → Actions →
#   New repository secret:  SUPABASE_URL       (e.g. https://abcdefgh.supabase.co)
#   New repository secret:  SUPABASE_ANON_KEY  (the "anon public" key)
# Test it: Actions tab → "Keep Supabase awake" → Run workflow.
#
# Note: GitHub turns off scheduled jobs in a repository with no commits for
# 60 days. It emails you first; one click on "Enable workflow" turns it back on.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 7 */3 * *"   # 07:17 UTC, every 3 days
  workflow_dispatch:          # "Run workflow" button, for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "The SUPABASE_URL and SUPABASE_ANON_KEY secrets are not set yet: nothing to do."
            exit 0
          fi
          # Forgive small copy-paste slips: quotes, spaces, "NAME=" in front, a "/" at the end
          URL=$(printf '%s' "$SUPABASE_URL" | sed -E 's/^[A-Z_]+=//; s/["'"'"' ]//g; s#/+$##')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | sed -E 's/^[A-Z_]+=//; s/["'"'"' ]//g' | tr -d '\r\n')
          case "$URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL should look like https://abcdefgh.supabase.co (check the repository secret)."; exit 1 ;;
          esac
          STATUS=$(curl --silent --max-time 30 -o answer.txt -w "%{http_code}" \
            -X POST "$URL/rest/v1/rpc/beyond_ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$STATUS" != "200" ]; then
            echo "Supabase answered HTTP $STATUS:"
            cat answer.txt; echo
            echo "401: the SUPABASE_ANON_KEY secret is wrong (use the sb_publishable_... or anon key)."
            echo "404: beyond_ping is missing (run supabase/schema.sql) or the URL is wrong."
            exit 1
          fi
          echo "Supabase answered: it is awake."
