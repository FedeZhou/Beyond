# Publishes the website on GitHub Pages every time you push to "main".
# While publishing, it writes js/config.js (the Supabase address and key for the
# members area) from repository secrets, so the key is never stored in GitHub's code.
#
# Setup (once):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL       (e.g. https://abcdefgh.supabase.co)
#        SUPABASE_ANON_KEY  (the "anon public" key, never the service_role key)
# Without the secrets the site still publishes; the members pages show demo mode.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the Supabase settings from the repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '// Written by the "Deploy site" workflow. Do not edit.\nwindow.BEYOND_CONFIG = %s;\n' \
            "$(jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" '{supabaseUrl: $url, supabaseAnonKey: $key}')" \
            > js/config.js
          if [ -z "$SUPABASE_URL" ]; then echo "No Supabase secrets yet: the members pages will run in demo mode."; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
