<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password | Beyond</title>
  <meta name="description" content="Choose a new password for your Beyond account.">
  <meta name="robots" content="noindex">
  <!-- The address of this page contains a private link: never send it to other sites -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#051C2C">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/content.js" defer></script>
  <!-- Supabase address and key: js/config.js is kept out of GitHub (see js/config.example.js) -->
  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
  <!-- Supabase library, pinned to one version; the integrity hash makes the browser refuse a modified copy -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous" defer></script>
  <script src="js/members.js" defer></script>
</head>

<body data-page="reset">
  <a class="skip-link" href="#main">Skip to content</a>

  <header id="site-header" class="site-header">
    <noscript>
      <nav class="container noscript-nav" aria-label="Main">
        <a href="index.html">Home</a> <a href="about.html">About</a>
        <a href="mentor.html">Become a mentor</a> <a href="mentee.html">Become a mentee</a>
        <a href="login.html">Login</a>
      </nav>
    </noscript>
  </header>

  <main id="main" tabindex="-1">

    <!-- =====================================================================
         PAGE HEADER
         ===================================================================== -->
    <section class="page-hero page-hero--compact" aria-labelledby="page-title">
      <div class="container">
        <p class="eyebrow eyebrow--light">Members</p>
        <h1 id="page-title" class="page-title">A new password.</h1>
        <p class="lead">Choose the password you will use to sign in to Beyond.</p>
      </div>
    </section>

    <section class="section members-section">
      <div class="container">
        <noscript><p class="members-notice is-error">The members area needs JavaScript. Please turn it on and reload the page.</p></noscript>
        <p class="form-demo-note members-demo" id="members-demo" hidden></p>
        <p class="members-notice" id="members-notice" role="alert" hidden></p>
        <p class="members-loading" id="members-loading" role="status">Loading&hellip;</p>

        <!-- Signed in through the emailed link (or already signed in): choose a password -->
        <div class="members-signin" id="password-panel" hidden>
          <div class="form-card">
            <h2>Choose a new password</h2>
            <form class="form" id="password-form" novalidate>
              <div class="field">
                <label for="new-password">
                  New password
                  <span class="field-hint" id="new-password-hint">At least 10 characters.</span>
                </label>
                <input class="input" id="new-password" name="password" type="password" autocomplete="new-password" maxlength="72" required aria-describedby="new-password-hint new-password-error">
                <p class="field-error" id="new-password-error" hidden></p>
              </div>
              <div class="field">
                <label for="new-password2">Repeat the new password</label>
                <input class="input" id="new-password2" name="password2" type="password" autocomplete="new-password" maxlength="72" required aria-describedby="new-password2-error">
                <p class="field-error" id="new-password2-error" hidden></p>
              </div>
              <p class="members-notice" id="password-status" role="status" hidden></p>
              <div class="form-actions card-actions">
                <button class="btn btn-primary" type="submit">Save my password</button>
                <a class="link-arrow" id="password-done" href="members.html" hidden>Go to the directory <span aria-hidden="true">&rarr;</span></a>
              </div>
            </form>
          </div>
        </div>

        <!-- No valid link -->
        <div class="members-inactive" id="password-message" hidden>
          <p id="password-message-text"></p>
          <a class="btn btn-primary" href="login.html">Go to login</a>
        </div>
      </div>
    </section>

  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
